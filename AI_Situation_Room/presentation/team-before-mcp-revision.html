><div class=\"net-node field\"><small>FIELD / 현장 구조</small><h3>Link-One</h3><p>구조 현황 · 대상자 상태</p><b>신진섭</b></div><div class=\"net-node aid\"><small>CARE / 응급 지원</small><h3>RESAID AI</h3><p>상태 해석 · 추가 확인 요청</p><b>채민주</b></div><div class=\"net-node command\"><small>COMMAND / 종합 판단</small><h3>AI 상황실</h3><p>근거 종합 · 임무와 계획 갱신</p><b>김대성 · 송민주</b></div><div class=\"net-label up\">상태 보고 ↑ ↓ 확인 요청</div><div class=\"net-label across\">응급 지원 요청 ⇄ 결과·근거</div><div class=\"net-core\">하나의 사건<br><strong>API</strong><small>연동 제안</small></div></div><div class=\"visual-foot\">연결선은 제안한 정보 흐름 · 실제 송수신 결과는 구현 후 확인</div>", "note": "제안은 간단합니다. 각자의 프로젝트는 자유롭게 개발하고, 마지막에 API로 필요한 결과를 주고받읍시다. API는 서로 다른 프로그램이 정보를 교환하는 약속입니다. Link-One이 현장 정보를 보내면 상황실이 받고, RESAID AI의 검토와 필요한 확인을 주고받은 뒤 결과를 다시 현장에 공유하는 방식입니다. 각자 만든 기능을 살리면서, 한 팀이 완성한 대응 흐름을 보여줄 수 있습니다.", "layout": "split", "seconds": 35, "refs": ["brief", "projects", "merit"], "call": "연결이 더하는 가치 <strong>개별 완성도 + 실제 연동 기술 + 공동 대응 시연</strong>", "cue": "장면의 이점과 그 이유를 연결해서 말합니다.", "proof": "공동 시연의 실제 실행과 역할별 기여를 같은 사건 기록으로 확인한다.", "eyebrow": "우리의 제안", "label": "우리의 제안", "why": "우리의 제안를 수상 경쟁력과 팀원의 이점으로 연결한다.", "source": "사용자 발표자료 제작 요청 · 신청팀 분석 및 팀 구성 · 2번 · 팀원 설득용 수상 전략 개정", "time": "2:45–3:20"}, {"scene": 10, "chapter": "중심 기술 1 / 판단과 근거", "title": "AI가 상황을 읽고,<br><em>RAG가 근거를 더합니다.</em>", "lead": "복합 사고에 필요한 여러 지침을 찾아,<br>현재 상황과 함께 검토하도록 설계합니다.", "sub": "", "visual": "<div class=\"reasoning-map\"><div class=\"map-input\"><small>현장 보고</small><h3>“충돌 후 화재,<br>일부 인명 추락”</h3><p>서로 겹친 사고 상황</p></div><div class=\"map-arrow a1\">→</div><div class=\"reasoning-core\"><small>AI 상황실 · 상황 해석과 종합</small><h3>상황을 이해하고 <br>필요한 대응을 검토</h3><div class=\"core-questions\"><span>무슨 위험인가?</span><span>어떤 근거가 필요한가?</span><span>무엇을 더 확인할까?</span></div></div><div class=\"map-arrow a2\">→</div><div class=\"map-output\"><small>사람에게 제시</small><h3>이유가 있는<br>대응 제안</h3><p>근거 · 미확인사항<br>확인 질문</p></div><div class=\"rag-bridge\"><span>관련 근거 요청 ↓</span><b>RAG · 필요한 구절 검색</b><span>찾 ": "split", "seconds": 35, "refs": ["merit", "story", "brief"], "call": "현장 가치의 증거 <strong>누락 감소 · 정정 반영 · 근거 오류를 같은 사례로 비교</strong>", "cue": "장면의 이점과 그 이유를 연결해서 말합니다.", "proof": "공동 시연의 실제 실행과 역할별 기여를 같은 사건 기록으로 확인한다.", "eyebrow": "정확성을 높이는 경로", "label": "정확성을 높이는 경로", "why": "정확성을 높이는 경로를 수상 경쟁력과 팀원의 이점으로 연결한다.", "source": "팀원 설득용 수상 전략 개정 · AI_situation_room_RAG_story.md · 사용자 발표자료 제작 요청", "time": "4:40–5:15"}, {"scene": 10, "chapter": "왜 수상에 유리한가", "title": "높게 평가받을 이유가<br><em>실제 결과로 남습니다.</em>", "lead": "협업·연동 기술·정확성·교육 활용을<br>각각 설명할 수 있는 공동 결과물.<br>이것이 우리가 노릴 평가상의 이점입니다.", "sub": "", "visual": "<div class=\"award-proof\"><article><b>협업</b><div><h3>내 결과가 동료의 판단을 바꾼다</h3><p>보여줄 증거 · 세 프로젝트의 왕복 처리와 역할별 기여</p></div></article><article><b>API 기술</b><div><h3>서로 다른 프로그램이 실제로 작동한다</h3><p>보여줄 증거 · 요청·응답·상태 반영·실패 처리</p></div></article><article><b>현장 정확성</b><div><h3>잘못 전달된 정보를 발견하고 바로잡는다</h3><p>보여줄 증거 · 불일치 발견 → 확인 → 관련 결과 갱신</p></div></article><article><b>교육 활용</b><div><h3>배운 기술이 대응안의 근거가 된다</h3><p>보여줄 증거 · 검색 구절·에이전트 보고·검증 결과</p></div></article></div>", "note": "이제 왜 평가에서 이점이 생기는지 정리할 수 있습니다. 협업은 서로의 결과가 다음 판단에 쓰이는 것으로 증명합니다. API 기술은 실제 요청과 응답, 상태 반영으로 증명합니다. 현장 정확성은 불일치를 발견하고 확인한 뒤 결과를 갱신하는 과정으로 보여줍니다. 교육 활용은 검색한 근거와 요원 보고가 대응안에 쓰인 장면으로 보여줍니다. 이 네 가지를 한 사건에서 보여줄 수 있다면, 각 프로젝트의 성과에 팀 전체의 설득력을 더할 수 있습니다.", "layout": "split", "seconds": 35, "refs": ["merit", "curriculum", "brief"], "call": "우리가 노리는 평가 이점 <strong>협업의 결과 + 연동 기술의 완성도 + 현장 활용 + 교육성과</strong>", "cue": "장면의 이점과 그 이유를 연결해서 말합니다.", "proof": "공동 시연의 실제 실행과 역할별 기여를 같은 사건 기록으로 확인한다.", "eyebrow": "왜 수상에 유리한가", "label": "왜 수상에 유리한가", "why": "왜 수상에 유리한가를 수상 경쟁력과 팀원의 이점으로 연결한다.", "source": "팀원 설득용 수상 전략 개정 · 사용자 제공 교육 커리큘럼 · 사용자 발표자료 제작 요청", "time": "5:15–5:50"}, {"scene": 10, "chapter": "추가 부담을 줄이는 방법", "title": "각자의 개발에 집중하고,<br><em>연결할 범위는 작게.</em>", "lead": "공통으로 정할 것은 시연 사건과 교환할 정보.<br>연결 코드·형식 조정·통합 문제는<br>제가 최대한 지원하겠습니다.", "sub": "개별 기능 완성 → 작은 연결 시험 → 공동 시연", "visual": "<div class=\"depth-stack\"><article class const $=s=>document.querySelector(s),deck=$('#deck'),overlay=$('#overlay');let current=0,overlayType=null,focusBefore=null,lastWheel=0,touchStart=null,toastTimer;
function resize(){deck.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}
function render(index,init=false){current=Math.max(0,Math.min(slides.length-1,index));const s=slides[current];$('#slide').dataset.layout=s.layout;$('#chapter').textContent=s.chapter;const wide=['wide','journey','concept'].includes(s.layout);$('#headline').innerHTML=wide?s.title.replaceAll('<br>',' '):s.title;$('#lead').innerHTML=wide?s.lead.replaceAll('<br>',' '):s.lead;$('#subline').innerHTML=s.sub;$('#visual').innerHTML=s.visual;$('#callout').innerHTML=s.call;$('#pageNum').textContent=String(current+1).padStart(2,'0');$('#chapterName').textContent=s.chapter;$('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;document.querySelectorAll('.progress button').forEach((b,i)=>{b.className=i===current?'active':i<current?'past':'';b.setAttribute('aria-current',i===current?'step':'false')});$('#slide').classList.remove('reveal');void deck.offsetWidth;$('#slide').classList.add('reveal');$('#announce').textContent=(current+1)+' / '+slides.length+' · '+s.chapter;if(!init)history.replaceState(null,'','#'+(current+1));if(innerWidth<768)window.scrollTo({top:0,behavior:'instant'})}
function move(d){if(overlay.hidden)render(current+d)}
function showOverlay(title,body,type){if(overlay.hidden)focusBefore=document.activeElement;overlayType=type;$('#overlayTitle').textContent=title;$('#overlayBody').innerHTML=body;overlay.hidden=false;$('#closeOverlay').focus({preventScroll:true})}
function closeOverlay(){overlay.hidden=true;overlayType=null;if(focusBefore?.isConnected)focusBefore.focus({preventScroll:true})}
function notes(){if(!overlay.hidden&&overlayType==='notes'){closeOverlay();return}const s=slides[current];showOverlay('발표 노트 · '+(current+1)+' '+s.chapter,'<div class="grid"><div><div class="label">대본 · 목표 '+s.time+'</div><p>'+s.note+'</p></div><aside><div class="label">진행 메모</div><p>'+s.cue+'</p><div class="label">표현 범위</div><p>팀 협업 제안입니다. 실제 연결과 기능 구현 범위는 증거로 확인합니다. 발표 시간은 실측 전 목표입니다.</p></aside></div>','notes')}
function sources(){if(!overlay.hidden&&overlayType==='sources'){closeOverlay();return}const s=slides[current];showOverlay('작성 근거 · '+s.chapter,s.refs.map(id=>{const r=references[id];return '<article class="reference-item"><small>'+r.kind+' · '+r.section+'</small><blockquote>'+r.quote+'</blockquote><a href="'+r.href+'" target="_blank" rel="noopener">'+r.doc+'</a></article>'}).join('')+'<div class="label">확인할 실행 증거</div><p>'+s.proof+'</p><p style="font-size:16px">인원은 4번 이미지, 과제 내용은 1~3번 이미지를 기준으로 했습니다. 공식 배점과 다른 팀의 구현 수준은 확인되지 않았습니다.</p>','sources')}
function help(){showOverlay('발표 조작','<p>방향키·Space·PageDown: 다음 장면<br>Home / End: 첫 장면 / 마지막 장면<br>N: 발표 노트 · B: 작성 근거 · F: 전체화면<br>Esc: 열린 창 닫기</p><p>하단 막대로 장면을 선택할 수 있습니다. 작은 세로 화면에서는 내용을 스크롤해 읽고 하단 화살표로 이동하세요.</p><button id="motionBtn">움직임 '+(deck.classList.contains('reduce-motion')?'켜기':'줄이기')+'</button><p style="font-size:16px">HTML 발표자료입니다. 도식은 제안한 흐름을 설명하며 실제 API 호출을 실행하지 않습니다.</p>','help');$('#motionBtn').onclick=()=>{deck.classList.toggle('reduce-motion');help()}}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('브라우저 메뉴에서 전체화면을 선택해 주세요.')}}
slides.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',(i+1)+'장 '+s.chapter);b.title=s.chapter;b.onclick=()=>render(i);$('#progress').append(b)});$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#notesBtn').onclick=notes;$('#sourcesBtn').onclick=sources;$('#helpBtn').onclick=help;$('#fullBtn').onclick=fullscreen;$('#closeOverlay').onclick=closeOverlay;
addEventListener('resize',resize);addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=slides.length)render(n-1,true)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape'){closeOverlay();return}if(!overlay.hidden){if(k==='tab'){const fs=[...overlay.querySelectorAll('button,a')];if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0].focus()}}if((k==='n'&&overlayType==='notes')||(k==='b'&&overlayType==='sources')){e.preventDefault();closeOverlay()}return}if(e.altKey||e.ctrlKey||e.metaKey)return;if(k===' '&&document.activeElement.tagName==='BUTTON')return;if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();if(!e.repeat)move(1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();if(!e.repeat)move(-1)}else if(k==='home'){e.preventDefault();render(0)}else if(k==='end'){e.preventDefault();render(slides.length-1)}else if(k==='n'){e.preventDefault();notes()}else if(k==='b'){e.preventDefault();sources()}else if(k==='f')fullscreen();else if(k==='?')help()});
addEventListener('wheel',e=>{if(innerWidth<768||!overlay.hidden||e.ctrlKey)return;e.preventDefault();if(Math.abs(e.deltaY)>18&&Date.now()-lastWheel>950){lastWheel=Date.now();move(Math.sign(e.deltaY))}},{passive:false});
addEventListener('touchstart',e=>{touchStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});addEventListener('touchend',e=>{if(!touchStart||!overlay.hidden)return;const dx=touchStart.x-e.changedTouches[0].clientX,dy=touchStart.y-e.changedTouches[0].clientY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))move(Math.sign(dx));touchStart=null},{passive:true});
resize();const initial=Number(location.hash.slice(1));render(Number.isInteger(initial)&&initial>=1&&initial<=slides.length?initial-1:0,true);
