자의 전문성이<br><em>꼭 필요한 이유가 있습니다.</em>", "lead": "현장에서 구조를 돕는 기술,<br>응급처치를 지원하는 기술,<br>전체 대응을 조율하는 기술.<br>각 프로젝트가 맡은 역할을 살립니다.", "sub": "2팀 · 신진섭 · 채민주 · 김대성 · 송민주", "visual": "<div class=\"project-details\"><article><span>01</span><div><small>신진섭 · Link-One</small><h3>구조 현장을 잇는 정보 공유</h3><p>흩어진 현장 구조 정보를 모아 구조 진행 상황을 파악하고, 초기 응급처치를 지원하는 프로젝트입니다.</p><b>현장에서 확인한 정보를 동료에게 전달합니다.</b></div></article><article><span>02</span><div><small>채민주 · RESAID AI</small><h3>필요한 응급처치를 찾는 AI</h3><p>응급의학 자료를 바탕으로 환자 상태에 맞는 처치 가이드와 추가로 확인할 내용을 제시합니다.</p><b>응급처치에 필요한 전문적인 검토를 더합니다.</b></div></article><article><span>03</span><div><small>김대성 · 송민주 · HAEON(해온)</small><h3>전체 상황을 보고 대응을 조율</h3><p>현장 보고와 기상·선박 정보, 대응 매뉴얼을 모아 전문요원들이 검토하고 대응 방향을 제안합니다.</p><b>여러 보고를 종합해 다음 대응을 함께 살핍니다.</b></div></article></div><div class=\"visual-foot\">신청 과제와 개발 방향을 바탕으로 한 역할 설명</div>", "note": "Link-One은 현장의 구조 정보를 잇는 프로젝트입니다. 구조 진행 상황을 파악하고 초기 응급처치를 지원하기 때문에, 실제 현장에서 무슨 일이 일어나는지 가장 가까이에서 알려줄 수 있습니다. RESAID AI는 응급의학 자료를 활용해 환자 상태에 필요한 처치 가이드와 확인사항을 제시합니다. 응급 지원의 전문성을 맡는 겁니다. 임시 명칭 HAEON, 해온은 해양경찰 멀티에이전트 의사결정 지원 시스템입니다. 현장 보고와 기상, 선박 정보, 매뉴얼을 모아 전문요원들이 검토하고 전체 대응 방향을 제안합니다. 이 세 프로젝트의 역할이 서로에게 필요하다는 것이 우리 팀의 강점입니다. 상황실장은 임무를 배정하고 전문요원은 병렬 검토하는 AI 오케스트라 방식이며, 최종 판단은 사용자가 합니다.", "layout": "split", "seconds": 45, "refs": ["roster", "projects", "merit"], "call": "우리 팀의 기회 <strong>현장 구조 · 응급 지원 · 종합 상황이 같은 사고에 필요하다</strong>", "cue": "장면의 이점과 그 이유를 연결해서 말합니다.", "proof": "공동 시연의 실제 실행과 역할별 기여를 같은 사건 기록으로 확인한다.", "eyebrow": "2팀에 이미 있는 강점", "label": "2팀에 이미 있는 강점", "why": "각 프로젝트의 역할과 현장에서 함께 쓸 수 있는 이유를 설명한다.", "source": "최신 팀 편성 이미지 · 4번 · 신청팀 분석 및 팀 구성 · 2번 · 팀원 설득용 수상 전략 개정", "time": "1:25–2:10"}, {"scene": 5, "chapter": "급박한 현장, 함께 보는 상황", "title": "상황은 계속 바뀝니다.<br><em>모두가 같은 상황을<br>보고 있어야 합니다.</em>", "lead": "환자가 발생하고, 구조 인원이 바뀌고,<br>기상까지 나빠지는 현장.<br>새 소식을 일일이 옮겨 적는 대신<br>서로의 화면에서 함께 확인합니다.", "sub": "공유된 보고 중 AI 검토에 사용할 내용은 담당자가 선택합니다.", "visual": "<div class=\"mismatch-scene\"><div class=\"report-strip fresh\"><small>동 시 알려줍니다. 이 과정이 반복되면서 놓친 정보를 보완하고, 지금 상황에 더 맞는 대응을 찾아가는 겁니다. 각자의 프로젝트로 이 흐름을 어떻게 이어갈 수 있을까요?", "layout": "journey", "seconds": 25, "refs": ["merit", "brief"], "call": "계속 이어지는 협업 <strong>현장 변화 → 정보 공유 → 종합 판단 → 현장 대응 → 다시 현장 변화</strong>", "cue": "마지막 문장에서 한 박자 멈춘 뒤 7장으로 넘깁니다. 여기까지 연결 방식은 공개하지 않습니다.", "proof": "공동 시연의 실제 실행과 역할별 기여를 같은 사건 기록으로 확인한다.", "eyebrow": "상황에 맞춰 계속 이어지는 대응", "label": "상황에 맞춰 계속 이어지는 대응", "why": "각 프로젝트의 역할과 현장에서 함께 쓸 수 있는 이유를 설명한다.", "source": "팀원 설득용 수상 전략 개정 · 사용자 발표자료 제작 요청", "time": "2:40–3:05"}, {"scene": 7, "chapter": "우리의 제안", "title": "각자의 프로젝트를<br><em>MCP로 연결합니다.</em>", "lead": "상황실을 중심으로<br>현장 보고와 검토 결과를 보내고,<br>필요할 때 최신 상황과 제안을 가져옵니다.", "sub": "MCP는 프로그램의 기능을 공통된 방식으로<br>찾고 호출할 수 있게 하는 연결 규약입니다.", "visual": "<div class=\"network\"><div class=\"orbit\"></div><div class=\"net-node field\"><small>FIELD / 현장 구조</small><h3>Link-One</h3><p>구조 현황 · 대상자 상태</p><b>신진섭</b></div><div class=\"net-node aid\"><small>CARE / 응급 지원</small><h3>RESAID AI</h3><p>상태 해석 · 추가 확인 요청</p><b>채민주</b></div><div class=\"net-node command\"><small>COMMAND / 종합 판단</small><h3>해온</h3><p>근거 종합 · 임무와 계획 갱신</p><b>김대성 · 송민주</b></div><div class=\"net-label up\">현장 보고 ⇄ 상황 요약·제안</div><div class=\"net-label across\">응급 검토 결과 ⇄ 최신 상황</div><div class=\"net-core\">연결 규약<br><strong>MCP</strong><small>적용할 기술</small></div></div><div class=\"visual-foot\">상황실 중심의 송수신 설계 · MCP 도구 호출은 구현 후 검증</div>", "note": "연결에 사용할 기술은 MCP입니다. 쉽게 말하면 각 프로그램의 기능을 같은 약속으로 요청하고 결과를 받는 방식입니다. 상황실에 MCP 서버를 두고, Link-One과 RESAID AI는 현장 보고나 검토 결과를 보냅니다. 필요할 때는 상황실의 최신 요약과 제안을 가져옵니다. 상황실에서는 수신 알림을 확인한 뒤 담당자가 선택한 보고로 AI 검토를 시작합니다. 처음에는 보내기와 가져오기 두 기능부터 완성하고, 실제 MCP 호출이 되는 모습을 시연하겠습니다.", "layout": "split", "seconds": 35, "refs": ["brief", "projects", "merit", "mcpplan"], "call": "적용할 연결 기술 <strong>MCP · 현장 정보 보내기 / 상황실의 최신 결과 가져오기</strong>", "cue": "장면의 이점과 그 이유를 연결해서 말합니다.", "proof": "MCP 도구 목록 조회, 보고 제출, 결과 조회의 실제 요청과 응답을 검증한다. 수신만으로 AI를 실행하지 않는지 확인한다.", "eyebrow": "우리의 제안", "label": "우리의 제안", "why": "각 프로젝트의 역할과 현장에서 함께 쓸 수 있는 이유를 설명한다.", "source": "사용자 발표자료 제작 요청 · 신청팀 분석 및 팀 구성 · 2번 · 팀원 설득용 수상 전략 개정 · MCP 연동과 담당자 선택 반영", "time": "3:05–3:40"}, {"scene": 8, "chapter": "중심 기술 1 / 판단과 근거", "title": "AI가 상황을 읽고,<br><em>RAG가 근거를 더합니다.</em>", "lead": "여러 사고가 겹쳐도 관련 매뉴얼을 함께 찾아,<br>현재 상황에 맞는 대응을 검토합니다.", "sub": "", "visual": "<div class=\"reasoning-map\"><div class=\"map-input\"><small>현장 보고</small><h3>“충돌 후 화재,<br>일부 인명 추락”</h3><p>충돌·화재·인명 사고가 겹친 상황</p></div><div class=\"map-arrow a1\">→</div><div class=\"reasoning-core\"><small>해온 · 상황 해석과 종합</small><h3>상황을 이해하고 <br>필요한 대응을 검토</h3><div class=\"core-questions\"><span>무슨 위험인가?</span><span>어떤 근거가 필요한가?</span><span>무엇을 더 확인할까?</span></div></div><div class=\"map-arrow a2\">→</div><div class=\"map-output\"><small>사람에게 제시</small><h3>근거를 확인할 수 있는<br>대응 제안</h3><p>근거 · 미확인사항<br>확인 질문</p></div><div class=\"rag-bridge\"><span>관련 근거 요청 ↓</span><b>RAG · 필요한 구절 검색</b><span>찾은 근거 제공 ↑</span></div><div class=\"manual-bank\"><article><small>충돌</small><b>선체·사건 확인</b></article><article><small>화재</small><b>위험·적용 조건</b></article><article><small>인명 구조</small><b>대상자·구조 현황</b></article></div><div class=\"map-conclusion\">AI는 상황에 맞춰 종합하고, 매뉴얼은 그 판단의 근거를 제공합니다.</div></div>", "note": "그 중심에는 해온이 있습니다. 첨부한 스토리의 핵심을 두 장으로 설명드리겠습니다. 먼저 AI가 현재 상황을 해석하고, RAG가 필요한 매뉴얼 구절을 찾아 근거로 제공합니다. 충돌과 화재, 인명 추락이 함께 일어나면 관련 지침을 함께 검토하는 겁니다. AI는 그 근거와 현장 정보를 종합해 대응안을 제안합니다. 법령과 필수 절차를 지키고, 사람이 최종 판단하는 구조입니다.", "layout": "concept", "seconds": 40, "refs": ["story", "ragpaper", "state", "mcpplan"], "call": "핵심 개념 <strong>상황을 해석하는 AI + 여러 지침을 찾는 RAG → 근거 있는 대응안</strong>", "cue": "왼쪽 신고 → 중앙 AI → 아래 다중 매뉴얼 → 오른쪽 대응안 순으로 짚습니다.", "proof": "벡터 검색 질의·실제 구절·적용 조건·제안의 연결을 확인한다. 벡터 RAG는 추가 구현 목표다.", "eyebrow": "중심 기술 1 / 판단과 근거", "label": "중심 기술 1 / 판단과 근거", "why": "각 프로젝트의 역할과 현장에서 함께 쓸 수 있는 이유를 설명한다.", "source": "AI_situation_room_RAG_story.md · Lewis et al. · NeurIPS 2020 · 13_현재상태_요구사항_인수인계.md · MCP 연동과 담당자 선택 반영", "time": "3:40–4:20"}, {"scene": 9, "chapter": "중심 기술 2 / 교육내용 function showOverlay(title,body,type){if(overlay.hidden)focusBefore=document.activeElement;overlayType=type;$('#overlayTitle').textContent=title;$('#overlayBody').innerHTML=body;overlay.hidden=false;$('#closeOverlay').focus({preventScroll:true})}
function closeOverlay(){overlay.hidden=true;overlayType=null;if(focusBefore?.isConnected)focusBefore.focus({preventScroll:true})}
function notes(){if(!overlay.hidden&&overlayType==='notes'){closeOverlay();return}const s=slides[current];showOverlay('발표 노트 · '+(current+1)+' '+s.chapter,'<div class="grid"><div><div class="label">대본 · 목표 '+s.time+'</div><p>'+s.note+'</p></div><aside><div class="label">진행 메모</div><p>'+s.cue+'</p><div class="label">표현 범위</div><p>팀 협업 제안입니다. 실제 연결과 기능 구현 범위는 증거로 확인합니다. 발표 시간은 실측 전 목표입니다.</p></aside></div>','notes')}
function sources(){if(!overlay.hidden&&overlayType==='sources'){closeOverlay();return}const s=slides[current];showOverlay('작성 근거 · '+s.chapter,s.refs.map(id=>{const r=references[id];return '<article class="reference-item"><small>'+r.kind+' · '+r.section+'</small><blockquote>'+r.quote+'</blockquote><a href="'+r.href+'" target="_blank" rel="noopener">'+r.doc+'</a></article>'}).join('')+'<div class="label">확인할 실행 증거</div><p>'+s.proof+'</p><p style="font-size:16px">인원은 4번 이미지, 과제 내용은 1~3번 이미지를 기준으로 했습니다. 공식 배점과 다른 팀의 구현 수준은 확인되지 않았습니다.</p>','sources')}
function help(){showOverlay('발표 조작','<p>방향키·Space·PageDown: 다음 장면<br>Home / End: 첫 장면 / 마지막 장면<br>N: 발표 노트 · B: 작성 근거 · F: 전체화면<br>Esc: 열린 창 닫기</p><p>하단 막대로 장면을 선택할 수 있습니다. 작은 세로 화면에서는 내용을 스크롤해 읽고 하단 화살표로 이동하세요.</p><button id="motionBtn">움직임 '+(deck.classList.contains('reduce-motion')?'켜기':'줄이기')+'</button><p style="font-size:16px">HTML 발표자료입니다. 도식은 제안한 흐름을 설명하며 실제 API 호출을 실행하지 않습니다.</p>','help');$('#motionBtn').onclick=()=>{deck.classList.toggle('reduce-motion');help()}}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,3500)}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{toast('브라우저 메뉴에서 전체화면을 선택해 주세요.')}}
slides.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',(i+1)+'장 '+s.chapter);b.title=s.chapter;b.onclick=()=>render(i);$('#progress').append(b)});$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#notesBtn').onclick=notes;$('#sourcesBtn').onclick=sources;$('#helpBtn').onclick=help;$('#fullBtn').onclick=fullscreen;$('#closeOverlay').onclick=closeOverlay;
addEventListener('resize',resize);addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=slides.length)render(n-1,true)});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='escape'){closeOverlay();return}if(!overlay.hidden){if(k==='tab'){const fs=[...overlay.querySelectorAll('button,a')];if(e.shiftKey&&document.activeElement===fs[0]){e.preventDefault();fs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===fs.at(-1)){e.preventDefault();fs[0].focus()}}if((k==='n'&&overlayType==='notes')||(k==='b'&&overlayType==='sources')){e.preventDefault();closeOverlay()}return}if(e.altKey||e.ctrlKey||e.metaKey)return;if(k===' '&&document.activeElement.tagName==='BUTTON')return;if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();if(!e.repeat)move(1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();if(!e.repeat)move(-1)}else if(k==='home'){e.preventDefault();render(0)}else if(k==='end'){e.preventDefault();render(slides.length-1)}else if(k==='n'){e.preventDefault();notes()}else if(k==='b'){e.preventDefault();sources()}else if(k==='f')fullscreen();else if(k==='?')help()});
addEventListener('wheel',e=>{if(innerWidth<768||!overlay.hidden||e.ctrlKey)return;e.preventDefault();if(Math.abs(e.deltaY)>18&&Date.now()-lastWheel>950){lastWheel=Date.now();move(Math.sign(e.deltaY))}},{passive:false});
addEventListener('touchstart',e=>{touchStart=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:null},{passive:true});addEventListener('touchend',e=>{if(!touchStart||!overlay.hidden)return;const dx=touchStart.x-e.changedTouches[0].clientX,dy=touchStart.y-e.changedTouches[0].clientY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))move(Math.sign(dx));touchStart=null},{passive:true});
resize();const initial=Number(location.hash.slice(1));render(Number.isInteger(initial)&&initial>=1&&initial<=slides.length?initial-1:0,true);
</script></body></html>
